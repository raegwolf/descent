[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.12.0
board = descent_esp32s3_n16r8
framework = arduino
monitor_speed = 115200
# Set to yes only for the small static-menu display diagnostic. The normal
# target stages the engine and boots directly into Level 1.
custom_menu_only = no
extra_scripts =
    pre:tools/embed_hog.py
    pre:tools/patch_tft_espi.py
    pre:tools/stage_engine.py

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

# This board exposes a WCH USB-to-UART bridge. Keep Serial on UART0, matching
# the validated esp32-test configuration.
build_unflags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -D ESP32=1
    -D ARDUINO_ARCH_ESP32=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D SHAREWARE=1
    -D RELEASE=1
    -D NDEBUG=1
    -D NASM=1
    -I include
    -I ../INCLUDES
    -I ../CFILE
    -I ../BIOS
    -I ../2D
    -I ../3D
    -I ../FIX
    -I ../VECMAT
    -I ../MISC
    -I ../MEM
    -I ../IFF
    -I ../PSLIB
    -I ../TEXMAP
    -I ../MAIN
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    # Required by TFT_eSPI 2.5.x on ESP32-S3. See patch_tft_espi.py for the
    # companion DMA callback correction copied from esp32-test.
    -D USE_FSPI_PORT=1
    -D SPI_FREQUENCY=40000000

[platformio]
default_envs = esp32-s3-n16r8
boards_dir = ../esp32/boards

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.12.0
board = descent_esp32s3_n16r8
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_tft_espi.py

# ESP32-S3-WROOM-1-N16R8: 16 MB quad-SPI flash and 8 MB octal-SPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.6
    bodmer/TFT_eSPI @ 2.5.43

# This board exposes a WCH USB-to-UART bridge. Keep Serial on UART0 instead of
# redirecting it to the ESP32-S3 native USB CDC/JTAG peripheral.
build_unflags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -D BOARD_HAS_PSRAM=1
    # Set to 0 for FPS tests with all UART logging compiled out.
    -D SERIAL_LOGGING_ENABLED=0
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    # TFT_eSPI 2.5.x must use its explicit FSPI path on ESP32-S3. Without this,
    # its raw register macros use host 0 and dereference address 0x10.
    -D USE_FSPI_PORT=1
    -D SPI_FREQUENCY=40000000

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.12.0
board = descent_esp32s3_n16r8
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/stage_engine.py

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D ARDUINO_ARCH_ESP32=1
    -D BOARD_HAS_PSRAM=1
    -D SHAREWARE=1
    -D RELEASE=1
    -D NDEBUG=1
    -D NASM=1
    -I include
    -I ../INCLUDES
    -I ../CFILE
    -I ../BIOS
    -I ../2D
    -I ../3D
    -I ../FIX
    -I ../VECMAT
    -I ../MISC
    -I ../MEM
    -I ../IFF
    -I ../PSLIB
    -I ../TEXMAP
    -I ../MAIN
    -funsigned-char
    -fwrapv
    -fcommon
    -fno-strict-aliasing
    -Wno-unknown-pragmas
    -Wno-implicit-function-declaration
    -Wno-int-conversion
    -Wno-incompatible-pointer-types
    -Wno-return-type
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=40000000
